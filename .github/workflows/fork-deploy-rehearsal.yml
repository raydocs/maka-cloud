# The go-live rehearsal (docs/fork/deploy.md, deploy/rehearsal/README.md): builds the images
# from deploy/Dockerfile and brings the stack up under Compose behind Caddy, with Caddy's own
# certificate authority on app.localhost, mcp.localhost and models.localhost, against stand-ins for
# the model and the sandbox, then runs the whole flow on it (deploy/rehearsal/flow.mjs). No keys, no
# real model, no real sandbox, no outbound call but the image builds' package downloads. Runs on every pull
# request and push to main, and once a day.
name: Fork deploy rehearsal

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: fork-deploy-rehearsal-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images and bring the stack up behind Caddy
        run: |
          export MAKA_REHEARSAL_DIR="$RUNNER_TEMP/rehearsal"
          deploy/rehearsal/up.sh
          echo "MAKA_REHEARSAL_DIR=$MAKA_REHEARSAL_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Sign in with the invite, a task and its result card, one approval answered once, a restart
      # in the middle of a task, a backup and a restore. The flow only speaks HTTP and runs the
      # one ops script, so the same step can run against a host that is not this one.
      #
      # Every CLI now runs as an agent account that is not the sandbox user, and the stand-in
      # sandbox has no second account yet, so each step that runs a task is an expected failure.
      # Take a step off this list when the rehearsal's sandbox has the account (see
      # deploy/rehearsal/README.md, "The agent account").
      - name: Run the flow
        env:
          MAKA_REHEARSAL_XFAIL: task,approval,restart,restart-reply?,backup-restore
        run: |
          set -a
          . "$MAKA_REHEARSAL_DIR/env"
          set +a
          node deploy/rehearsal/flow.mjs

      - name: Show the logs of the stack
        if: failure()
        run: |
          deploy/rehearsal/ops.sh ps || true
          deploy/rehearsal/ops.sh logs || true

      - name: Take the stack down
        if: always()
        run: deploy/rehearsal/down.sh || true
