# The go-live rehearsal (docs/fork/deploy.md, deploy/rehearsal/README.md): builds the images
# from deploy/Dockerfile and brings the stack up under Compose behind Caddy, with Caddy's own
# certificate authority on app.localhost, mcp.localhost and models.localhost, against stand-ins for
# the model and the sandbox, then runs the whole flow on it (deploy/rehearsal/flow.mjs). No keys, no
# real model, no real sandbox, no outbound call but the image builds' package downloads. Runs on every pull
# request and push to main, and once a day.
name: Fork deploy rehearsal

on:
  pull_request:
    branches: [main]
    # The images build the packages and the deploy files. The push to main and the nightly run have
    # no filter, so a change the list misses still runs this lane.
    paths:
      - 'packages/**'
      - 'deploy/**'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/fork-deploy-rehearsal.yml'
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: fork-deploy-rehearsal-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rehearsal:
    # The repository variable CI_RUNNER_DOCKER, else CI_RUNNER (a JSON label list such as
    # ["self-hosted","vps"]), moves this job to a self-hosted runner; unset, it runs on GitHub's pinned
    # image. Deleting the variable is the way back, with no commit. CI_RUNNER_DOCKER names a label only
    # one runner carries: the rehearsal binds ports 80 and 443 and a fixed Compose project, so two at
    # once on one host would collide.
    runs-on: ${{ (vars.CI_RUNNER_DOCKER || vars.CI_RUNNER) && !github.event.pull_request.head.repo.fork && fromJSON(vars.CI_RUNNER_DOCKER || vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A coding task's checks run in a new user and PID namespace (unshare). Ubuntu 24.04 refuses
      # that to unprivileged users by default (AppArmor), whatever the container's own profile says,
      # and a real box on 24.04 has to allow it the same way (docs/fork/deploy.md, "The agent account").
      # Ubuntu gates unprivileged user namespaces through AppArmor; a runner without that knob
      # (Debian, or an already-open kernel) needs nothing, as in ci.yml.
      - name: Allow unprivileged user namespaces, as the sandbox box must
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build the images and bring the stack up behind Caddy
        run: |
          export MAKA_REHEARSAL_DIR="$RUNNER_TEMP/rehearsal"
          deploy/rehearsal/up.sh
          echo "MAKA_REHEARSAL_DIR=$MAKA_REHEARSAL_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Sign in with the invite, a task and its result card, one approval answered once, a restart
      # in the middle of a task, a backup and a restore. The flow only speaks HTTP and runs the
      # one ops script, so the same step can run against a host that is not this one. The stand-in
      # sandbox has the agent account every CLI runs as (deploy/rehearsal/README.md, "The agent
      # account"), so no step is an expected failure; MAKA_REHEARSAL_XFAIL is the place to mark one.
      - name: Run the flow
        run: |
          set -a
          . "$MAKA_REHEARSAL_DIR/env"
          set +a
          node deploy/rehearsal/flow.mjs

      - name: Show the logs of the stack
        if: failure()
        run: |
          deploy/rehearsal/ops.sh ps || true
          deploy/rehearsal/ops.sh logs || true

      - name: Take the stack down
        if: always()
        run: deploy/rehearsal/down.sh || true

  # The tests of cloud-runners and the coding suite of cloud-playbooks that need a second account (the agent boundary:
  # channel, handoff, checkout, checks, the box check itself) are skipped on a hosted runner. This
  # job runs them as root beside `maka-agent`, in the same kind of image the rehearsal's sandbox is
  # made from (deploy/Dockerfile, target `real-account-tests`). They fail here instead of skipping.
  real-accounts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checks run in a new user and PID namespace, as in the rehearsal.
      - name: Allow unprivileged user namespaces, as the sandbox box must
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the test image
        run: docker build -f deploy/Dockerfile --target real-account-tests -t maka-real-account-tests .

      - name: Run the real-account tests as root
        run: >-
          docker run --rm
          --security-opt seccomp=unconfined --security-opt apparmor=unconfined
          maka-real-account-tests
