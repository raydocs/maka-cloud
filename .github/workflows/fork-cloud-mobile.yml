# Checks the phone apps (T29): packages/cloud-mobile, one Expo codebase for iOS and Android, on the logic it
# shares with the web app (packages/cloud-client). Neither package is a root workspace, so ci.yml does not
# cover them. No keys, no model, no store: the end-to-end jobs run the app in a simulator or an emulator
# against the same scripted stack the web tests use (the real server, a scripted runner, nothing live), and
# nothing here is ever submitted to a store.
#
# Pull requests run it when they touch the apps or the shared logic; every push to main runs it.
name: Fork cloud-mobile

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/cloud-mobile/**'
      - 'packages/cloud-client/**'
      - 'packages/cloud-design/**'
      - '.github/workflows/fork-cloud-mobile.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-cloud-mobile-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Maestro drives the app on the device. Pinned, and its archive is checked against this digest.
  MAESTRO_VERSION: '2.11.0'
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a

jobs:
  checks:
    # The repository variable CI_RUNNER (a JSON label list such as ["self-hosted","boat"]) moves
    # this job to a self-hosted runner; unset, it runs on GitHub's pinned image. Deleting the
    # variable is the way back, with no commit.
    runs-on: ${{ vars.CI_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install
        run: |
          npm --prefix packages/cloud-client ci --workspaces=false --ignore-scripts --no-audit --no-fund
          npm --prefix packages/cloud-mobile ci --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm --prefix packages/cloud-mobile run typecheck

      - name: Component and session tests
        run: npm --prefix packages/cloud-mobile test

      # Metro resolves the shared package and every screen, once per platform: a bad import fails here, in
      # a minute, rather than in a native build.
      - name: Bundle for iOS and Android
        working-directory: packages/cloud-mobile
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/export"
        env:
          CI: '1'

  android:
    # CI_RUNNER_MAC moves this job to the owner's Mac (Apple silicon), whose SDK sits at the runner's
    # ANDROID_HOME and whose emulator runs arm64; unset, it runs on GitHub's image, which carries the
    # SDK and runs the emulator under KVM.
    runs-on: ${{ vars.CI_RUNNER_MAC && !github.event.pull_request.head.repo.fork && fromJSON(vars.CI_RUNNER_MAC) || 'ubuntu-24.04' }}
    # The build is the long step: a cold Gradle cache and one ABI, then the emulator flows.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # The release build leaves the disk too full for the emulator's system image (the runner then fails
      # with "No space left on device" while installing it). These toolchains are not used by this job.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Install the stack and the app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/cloud-web ci --workspaces=false --ignore-scripts --no-audit --no-fund
          npm --prefix packages/cloud-client ci --workspaces=false --ignore-scripts --no-audit --no-fund
          npm --prefix packages/cloud-mobile ci --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Build the stack the app talks to
        run: |
          npm --workspace @maka/core run build
          npm --workspace @maka/storage run build
          npm --workspace @maka/mcp run build
          npm --workspace @maka/runtime run build
          npm --workspace @maka-cloud/orchestrator run build
          npm --workspace @maka-cloud/modes run build
          npm --workspace @maka-cloud/memory run build
          npm --workspace @maka-cloud/server run build
          npm --workspace @maka-cloud/instabox run build
          npm --workspace @maka-cloud/runners run build
          npm --workspace @maka-cloud/conductor-checks run build
          npm --workspace @maka-cloud/conductor run build
          npm --workspace @maka-cloud/playbooks run build
          npm --workspace @maka-cloud/supervisor run build

      # Gradle's downloaded dependencies and wrapper, kept between runs. Keyed on the app's lockfile, so a
      # new Expo or React Native version starts cold. A self-hosted runner keeps ~/.gradle itself.
      - name: Cache Gradle
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/cloud-mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # A release build carries its own JavaScript, so no dev server is needed on the emulator. It is signed
      # with the debug key Expo generates; it is never uploaded anywhere. Only the one ABI the emulator below
      # runs is compiled (x86_64, or arm64-v8a on Apple silicon); all four took about 43 minutes.
      - name: Build the app
        working-directory: packages/cloud-mobile
        run: |
          npx expo prebuild --platform android --no-install
          # Gradle fetches its plugins from the public repositories; a reset connection is retried.
          for attempt in 1 2 3; do
            (cd android && ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures="$ABI") && exit 0
            echo "Gradle attempt $attempt failed" >&2
            sleep 15
          done
          exit 1
        env:
          ABI: ${{ runner.arch == 'ARM64' && 'arm64-v8a' || 'x86_64' }}
          CI: '1'
          MAKA_E2E: '1'

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 --check -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Start the scripted stack
        run: |
          # The owner's Mac can still hold the stack of an earlier, cancelled run; its old code would
          # answer instead of this build's, and the new stack could not take the port.
          pids=$(lsof -ti tcp:4174 -ti tcp:4175 || true)
          if [ -n "$pids" ]; then kill $pids || true; sleep 2; fi
          node packages/cloud-web/tests/support/serve.ts > "$RUNNER_TEMP/stack.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/stack.pid"
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:4175/health >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/stack.log"
          exit 1

      - name: Enable KVM for the emulator
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Disk before the emulator
        run: df -h /

      # adb's mDNS discovery aborts on a malformed service name from the local network (seen on
      # the owner's Mac); the emulator is reached over TCP, so discovery is not needed.
      - name: Run the flows on an Android emulator
        env:
          ADB_MDNS: '0'
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          arch: ${{ runner.arch == 'ARM64' && 'arm64-v8a' || 'x86_64' }}
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          script: bash packages/cloud-mobile/scripts/run-flows.sh android

      - name: Stop the scripted stack
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/stack.pid")" 2>/dev/null || true

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-mobile-android
          path: |
            packages/cloud-mobile/e2e-output
            ${{ runner.temp }}/stack.log
          retention-days: 7

  ios:
    # CI_RUNNER_MAC (a JSON label list such as ["self-hosted","mac"]) moves this job to a Mac of the
    # owner's; unset, it runs on GitHub's macos-15. Deleting the variable is the way back.
    runs-on: ${{ vars.CI_RUNNER_MAC && !github.event.pull_request.head.repo.fork && fromJSON(vars.CI_RUNNER_MAC) || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the stack and the app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/cloud-web ci --workspaces=false --ignore-scripts --no-audit --no-fund
          npm --prefix packages/cloud-client ci --workspaces=false --ignore-scripts --no-audit --no-fund
          npm --prefix packages/cloud-mobile ci --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Build the stack the app talks to
        run: |
          npm --workspace @maka/core run build
          npm --workspace @maka/storage run build
          npm --workspace @maka/mcp run build
          npm --workspace @maka/runtime run build
          npm --workspace @maka-cloud/orchestrator run build
          npm --workspace @maka-cloud/modes run build
          npm --workspace @maka-cloud/memory run build
          npm --workspace @maka-cloud/server run build
          npm --workspace @maka-cloud/instabox run build
          npm --workspace @maka-cloud/runners run build
          npm --workspace @maka-cloud/conductor-checks run build
          npm --workspace @maka-cloud/conductor run build
          npm --workspace @maka-cloud/playbooks run build
          npm --workspace @maka-cloud/supervisor run build

      # Expo SDK 58 needs Swift tools 6.2 (Xcode 26); the runner's default Xcode is older.
      - name: Select the newest Xcode
        run: |
          # GitHub's image keeps several Xcodes as Xcode_N.app; a self-hosted Mac has its one Xcode
          # selected already, so nothing is switched there (and no sudo is needed).
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$xcode" ]; then
            echo "Using $xcode"
            sudo xcode-select -s "$xcode"
          fi
          xcodebuild -version

      # A release build for the simulator carries its own JavaScript. Nothing is signed or uploaded.
      - name: Build the app for the simulator
        working-directory: packages/cloud-mobile
        run: |
          set -o pipefail
          npx expo prebuild --platform ios
          # The whole log is kept; the console shows only what failed and how it ended.
          xcodebuild -workspace ios/Maka.xcworkspace -scheme Maka -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -E "error:|\*\* BUILD" "$RUNNER_TEMP/xcodebuild.log" | head -n 40; exit 1; }
          tail -n 3 "$RUNNER_TEMP/xcodebuild.log"
          test -f "$RUNNER_TEMP/ios-build/Build/Products/Release-iphonesimulator/Maka.app/Info.plist"
        env:
          CI: '1'
          MAKA_E2E: '1'

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 --check -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Start the scripted stack
        run: |
          # A self-hosted Mac can still hold the stack of an earlier, cancelled run; its old code
          # would answer instead of this build's, and the new stack could not take the port.
          pids=$(lsof -ti tcp:4174 -ti tcp:4175 || true)
          if [ -n "$pids" ]; then kill $pids || true; sleep 2; fi
          node packages/cloud-web/tests/support/serve.ts > "$RUNNER_TEMP/stack.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/stack.pid"
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:4175/health >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/stack.log"
          exit 1

      - name: Boot a simulator and run the flows
        run: |
          udid=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("node:fs").readFileSync(0, "utf8")).devices;
            const phone = Object.entries(d).filter(([k]) => k.includes("iOS")).flatMap(([, v]) => v).find((x) => x.name.startsWith("iPhone"));
            if (!phone) process.exit(1);
            console.log(phone.udid);
          ')
          # A self-hosted Mac keeps the simulator from the last run; booting a booted one is an error.
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/ios-build/Build/Products/Release-iphonesimulator/Maka.app"
          bash packages/cloud-mobile/scripts/run-flows.sh ios
        env:
          # Maestro starts an XCTest driver on the simulator; a cold hosted Mac needs more than the default.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'

      - name: Stop the scripted stack
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/stack.pid")" 2>/dev/null || true

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-mobile-ios
          path: |
            packages/cloud-mobile/e2e-output
            ${{ runner.temp }}/stack.log
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
