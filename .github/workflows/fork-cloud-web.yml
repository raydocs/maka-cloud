# Builds and tests packages/cloud-web (T9) against the real cloud-server with a
# fake runner, and the logic it shares with the phone apps, packages/cloud-client
# (T29). Neither package is a root workspace (their toolchain pins differ
# from the root's), so ci.yml does not cover them. No keys, no model, no network
# beyond localhost.
name: Fork cloud-web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-cloud-web-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cloud-web:
    # The repository variable CI_RUNNER (a JSON label list such as ["self-hosted","boat"]) moves
    # this job to a self-hosted runner; unset, it runs on GitHub's pinned image. Deleting the
    # variable is the way back, with no commit.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # The tests start the built server, so build it and what it imports.
      # Scripts are skipped: nothing here needs the desktop app's postinstall.
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The inbox tests also start the real supervisor, which builds on the
      # playbooks, conductor and runners (and the runtime they import).
      - name: Build the server and the supervisor
        run: |
          npm --workspace @maka/core run build
          npm --workspace @maka/storage run build
          npm --workspace @maka/mcp run build
          npm --workspace @maka/runtime run build
          npm --workspace @maka-cloud/orchestrator run build
          npm --workspace @maka-cloud/modes run build
          npm --workspace @maka-cloud/memory run build
          npm --workspace @maka-cloud/server run build
          npm --workspace @maka-cloud/instabox run build
          npm --workspace @maka-cloud/runners run build
          npm --workspace @maka-cloud/conductor-checks run build
          npm --workspace @maka-cloud/conductor run build
          npm --workspace @maka-cloud/playbooks run build
          npm --workspace @maka-cloud/supervisor run build

      # The logic the web app and the phone apps share (T29). Source-only, no
      # DOM: its tests run in plain Node, once for every client.
      - name: Typecheck and test the shared client logic
        run: |
          npm --prefix packages/cloud-client ci --workspaces=false --ignore-scripts --no-audit --no-fund
          npm --prefix packages/cloud-client run typecheck
          npm --prefix packages/cloud-client test

      # cloud-web's tokens.css and cloud-mobile's tokens.generated.ts come from
      # packages/cloud-design; a hand edit to either, or a token change without
      # regenerating, fails here.
      - name: Design tokens are generated and up to date
        run: |
          node packages/cloud-design/src/generate.ts --check
          node --test packages/cloud-design/src/generate.test.ts

      - name: Install cloud-web dependencies
        run: npm --prefix packages/cloud-web ci --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build
        run: npm --prefix packages/cloud-web run build

      - name: Component and real-server integration tests
        run: npm --prefix packages/cloud-web test

      - name: Install the browser
        run: npm --prefix packages/cloud-web exec -- playwright install --with-deps chromium

      - name: Playwright against the real server, desktop and phone
        run: npm --prefix packages/cloud-web run test:e2e

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-web-playwright
          path: |
            packages/cloud-web/playwright-report
            packages/cloud-web/test-results
          retention-days: 7
