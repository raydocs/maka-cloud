# Mirrors apache/maka main into the `upstream` branch and opens a pull request
# into `main` when main is behind. See AGENTS.md "Upstream sync".
#
# Needs the repository secret FORK_SYNC_TOKEN: a fine-grained token for this
# repository with Contents, Pull requests, Workflows and Actions set to
# read and write. GITHUB_TOKEN cannot push upstream commits that change
# workflow files.
name: Fork upstream sync

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the FORK_SYNC_TOKEN repository secret (see the header of this workflow)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Mirror apache/maka main to the upstream branch
        run: |
          git fetch --no-tags https://github.com/apache/maka.git main
          git push --force origin FETCH_HEAD:refs/heads/upstream

      - name: Open a sync pull request when main is behind
        run: |
          git fetch --no-tags origin main upstream
          if git merge-base --is-ancestor origin/upstream origin/main; then
            echo "main already contains upstream"
            exit 0
          fi
          open=$(gh pr list --head upstream --base main --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "sync pull request #$open is already open"
            exit 0
          fi
          gh pr create --head upstream --base main \
            --title "Sync upstream apache/maka" \
            --body "Merges the latest apache/maka main. Merge with **Create a merge commit**, never squash or rebase, or the next sync will conflict again. Resolve conflicts on a branch cut from main, as AGENTS.md describes."

      # Upstream CI stays on; release, publish and scheduled upstream jobs do not
      # belong to this fork.
      - name: Keep inherited upstream workflows disabled
        run: |
          gh workflow list --all --json path,state --jq '.[] | select(.state == "active") | .path' |
            grep -v -e '^\.github/workflows/fork-' -e '^\.github/workflows/ci\.yml$' |
            while read -r path; do
              echo "disabling $path"
              gh workflow disable "$(basename "$path")"
            done
