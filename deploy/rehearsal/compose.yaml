# The go-live rehearsal: deploy/compose.yaml plus stand-ins for the model API and the sandbox API,
# and Caddy on its own certificate authority. No real model, sandbox, key or domain.
#
#   deploy/rehearsal/up.sh          build, bring the stack up, wait until it is healthy
#   deploy/rehearsal/down.sh        take it down and delete its volumes
#
# The server's settings are deploy/rehearsal/server.env (with the sandbox map up.sh adds), the names
# are deploy/rehearsal/compose.env. See deploy/rehearsal/README.md.
# Relative paths here resolve against the first file (deploy/), not against this one.
#
# Nothing here may be shared with a real deployment on the same host: the project has its own name
# (so its volumes, networks and containers do), and so do the images, which the rehearsal builds
# itself rather than retagging maka-cloud:local. lib.sh refuses to change a stack that does not
# resolve to these names.
name: maka-rehearsal

services:
  stubs:
    # The server's own image (the stand-ins use the workspaces' test doubles, which it carries).
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    image: maka-rehearsal:local
    entrypoint: ["node", "deploy/rehearsal/stubs.mjs"]
    environment:
      INSTABOX_API_KEY: ibk_rehearsal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9102/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      # The flow steers the scripted claude from the host through this port; nothing else listens outside.
      - "127.0.0.1:9102:9102"

  maka-cloud:
    image: maka-rehearsal:local
    depends_on:
      stubs:
        condition: service_healthy

  proxy:
    image: maka-rehearsal-proxy:local
