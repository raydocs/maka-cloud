# A first visit lands on Home; one sentence starts a conversation and opens it in Chat.
appId: cloud.maka.app
---
- runFlow: subflows/sign-in.yaml
- assertVisible:
    id: "home-start-title"
- takeScreenshot: home-first-visit
- tapOn:
    id: "field-What would you like to get done\\?"
- inputText: "Summarise what changed this week"
# On iOS the keyboard's dismiss action taps the screen, which can press an example start instead; the
# Start button is above the keyboard there.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "button-Start"
- assertVisible: "Summarise what changed this week"
- assertVisible:
    id: "field-Keep the conversation going"
- takeScreenshot: chat-started
