# Signs in with an invite token: the server address and token passed as -e SERVER=... -e TOKEN=...
appId: cloud.maka.app
---
- launchApp:
    clearState: true
# A slow hosted emulator sometimes shows the launcher's "isn't responding" box over the app.
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
# A cold start on a hosted emulator can take a while to draw the first screen.
- extendedWaitUntil:
    visible:
      id: "field-Server address"
    timeout: 45000
    optional: true
# Android can kill the freshly launched process while it is still removing the task that clearState
# stopped ("Destroy timeout of remove-task"), leaving a blank window. Launch once more if so.
- runFlow:
    when:
      notVisible:
        id: "field-Server address"
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: "field-Server address"
          timeout: 60000
- takeScreenshot: sign-in-empty
- tapOn:
    id: "field-Server address"
- inputText: ${SERVER}
- tapOn:
    id: "button-Continue"
# The first screen offers the ways in; a hand-made invite token is the small link at the bottom.
- extendedWaitUntil:
    visible:
      id: "button-I have an invite token"
    timeout: 30000
- takeScreenshot: sign-in-choose
- tapOn:
    id: "button-I have an invite token"
- tapOn:
    id: "field-Invite token"
- inputText: ${TOKEN}
# With the keyboard up, as a person sees it while typing.
- takeScreenshot: sign-in-typing
# Maestro's hideKeyboard cannot dismiss this app's keyboard on newer iOS simulators (iOS 27), so
# iOS presses Return, which closes a one-line field's keyboard (and may submit the form).
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
# On iOS the keyboard's own dismissal can already have submitted the form.
- runFlow:
    when:
      visible:
        id: "button-Enter your workspace"
    commands:
      - tapOn:
          id: "button-Enter your workspace"
