# A finished task arrives as one result card: its outcome, its picture (opened large), its pull request,
# and a details page behind it. The pages it opened are listed under it.
appId: cloud.maka.app
---
- runFlow: subflows/sign-in.yaml
- assertVisible:
    id: "field-Keep the conversation going"
- scrollUntilVisible:
    element:
      id: "delivery-picture"
- assertVisible: "Login page after fix"
- assertVisible: "Open pull request · github.com ↗"
- takeScreenshot: delivery-card
- tapOn:
    id: "delivery-picture"
- assertVisible:
    id: "button-Close"
- takeScreenshot: delivery-viewer
- tapOn:
    id: "button-Close"
# The card's top is above the picture the list was scrolled to.
- scrollUntilVisible:
    element:
      id: "button-Details"
    direction: UP
- tapOn:
    id: "button-Details"
- assertVisible: "Outcome"
- assertVisible: "Redirects once after sign-in"
- takeScreenshot: delivery-details
