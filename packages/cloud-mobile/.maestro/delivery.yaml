# A finished task arrives as one result card: its outcome, its picture (opened large), its pull request,
# and a details page behind it. The pages it opened are listed under it.
appId: cloud.maka.app
---
- runFlow: subflows/sign-in.yaml
- assertVisible:
    id: "field-Keep the conversation going"
# The chat scrolls itself to the end when something waits on the person, which can leave the result
# card above the screen (a taller simulator shows more below it), so look down first, then up.
- scrollUntilVisible:
    element:
      id: "delivery-picture"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "delivery-picture"
    commands:
      - scrollUntilVisible:
          element:
            id: "delivery-picture"
          direction: UP
- assertVisible: "Login page after fix"
# The pull request button sits under the picture; a longer conversation title above can leave it
# just below the fold, so scroll to it rather than assume it fits.
- scrollUntilVisible:
    element: "Open pull request · github.com"
- assertVisible: "Open pull request · github.com"
- takeScreenshot: delivery-card
- tapOn:
    id: "delivery-picture"
- assertVisible:
    id: "button-Close"
- takeScreenshot: delivery-viewer
- tapOn:
    id: "button-Close"
# The card's top is above the picture the list was scrolled to.
- scrollUntilVisible:
    element:
      id: "button-Details"
    direction: UP
- tapOn:
    id: "button-Details"
- assertVisible: "Outcome"
- assertVisible: ".*Redirects once after sign-in"
- takeScreenshot: delivery-details
