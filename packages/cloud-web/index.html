<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b4cbee" />
    <title>Maka — 一起把事情做完</title>
    <script>
      // The scheme before the first paint, as theme.tsx reads it: a stored choice, else the device's.
      (function () {
        var stored;
        try {
          stored = localStorage.getItem('maka.theme');
        } catch (e) {}
        // "sky": dark from sunset to sunrise, the same rule as daylight() in theme.tsx.
        function sunUp(now) {
          var year = now.getFullYear();
          var standard = Math.max(
            new Date(year, 0, 1).getTimezoneOffset(),
            new Date(year, 6, 1).getTimezoneOffset(),
          );
          var day = Math.floor((now - new Date(year, 0, 0)) / 86400000);
          var decl = ((23.44 * Math.PI) / 180) * Math.sin((2 * Math.PI * (284 + day)) / 365);
          var half =
            (Math.acos(-Math.tan((35 * Math.PI) / 180) * Math.tan(decl)) * 180) / Math.PI / 15;
          var noon = 12 + (standard - now.getTimezoneOffset()) / 60;
          var hour = now.getHours() + now.getMinutes() / 60;
          return hour >= noon - half && hour < noon + half;
        }
        var dark =
          stored === 'dark' ||
          (stored === 'sky' && !sunUp(new Date())) ||
          (stored !== 'light' &&
            stored !== 'sky' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
      // The language before the first paint, as i18n.tsx picks it, so the right Chinese glyphs load.
      (function () {
        var lang;
        try {
          lang = localStorage.getItem('maka.language');
        } catch (e) {}
        if (lang !== 'en' && lang !== 'zh-Hans' && lang !== 'zh-Hant') {
          var first = ((navigator.languages && navigator.languages[0]) || '').toLowerCase();
          lang = /^zh-(?:hant|tw|hk|mo)(?:-|$)/.test(first)
            ? 'zh-Hant'
            : first === 'en' || first.indexOf('en-') === 0
              ? 'en'
              : 'zh-Hans';
        }
        document.documentElement.setAttribute('lang', lang);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
